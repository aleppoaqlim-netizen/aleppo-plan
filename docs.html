<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>الوثائق والالتزامات والضمانات</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/base.css"><style></style></head>
<body><div class="wrap"><h1>الوثائق المطلوبة والالتزامات والضمانات</h1><p class="lead">اختر مسار مشروعك لتظهر الوثائق الخاصة به، وعلّم ما جهّزته لتتابع نسبة الاكتمال.</p>
<div class="chips" id="tc"></div>
<div class="grid g2" style="align-items:start"><div class="card"><h3 style="margin-top:0;font-size:19px">قائمة الوثائق المطلوبة</h3>
<div style="display:flex;align-items:center;gap:12px;margin:8px 0 12px"><div class="track" style="flex:1"><div class="fill" id="pf" style="background:var(--grn);width:0"></div></div><b id="pt" style="color:var(--gold)">0 / 0</b></div><div id="dl"></div><p class="src" id="nt"></p></div>
<div class="grid"><div class="card"><h3 style="margin-top:0">مسار التنفيذ</h3><p id="ex"></p></div><div class="card"><h3 style="margin-top:0">النتائج المرجوة</h3><div class="chips" id="rs" style="margin:6px 0 0"></div></div></div></div>
<div class="grid g2" style="margin-top:14px"><div class="card"><h3 style="margin-top:0;font-size:19px;color:var(--amb)">الالتزامات بعد ترخيص المشروع</h3><ul class="l" id="ob"></ul></div><div class="card"><h3 style="margin-top:0;font-size:19px;color:var(--grn)">الضمانات</h3><ul class="l" id="gu"></ul></div></div>
<p class="src" style="margin-top:14px">المصدر: مقترح أولي منصة (ملف الإكسل)</p></div><script src="assets/base.js"></script><script>const TR=[{"g": "المجمع السكني", "t": "ضمن المخططات التنظيمية مع وجود دراسة تفصيلية", "s": "مجمع سكني — مع دراسة تفصيلية"}, {"g": "المجمع السكني", "t": "ضمن المخططات التنظيمية مع عدم وجود دراسة تفصيلية", "s": "مجمع سكني — دون دراسة"}, {"g": "التجمع العمراني", "t": "خارج حدود المخططات التنظيمية", "s": "التجمع العمراني"}, {"g": "تجمعات السكن الزراعي", "t": "خارج حدود المخططات التنظيمية", "s": "السكن الزراعي"}],DOCS=[{"l": "مذكرة تبريرية تتضمن الموقع المساحة - الإستيعاب السكاني - الغاية من الإحداث", "per": [null, null, null, null]}, {"l": "مذكرة الربط و علاقة المشروع بالجوارتتضمن الإنسجام مع المخطط التوجيهي لرؤية حلب الكبرى", "per": [null, null, "ربط المشروع بالطرق الحيوية بطريق نافذ لا يقل عرضه عن 12 م ينفذ على حساب المشروع و تنفذ الطرق حسب مخطط الأرض المعتمد", "ربط المشروع بالطرق الحيوية بطريق نافذ لا يقل عرضه عن 12 م ينفذ على حساب المشروع و تنفذ الطرق حسب مخطط الأرض المعتمد"]}, {"l": "المقترح التخطيطي الأولي يتضمن المشيدات العامة و الطرق و المرافق و البنى التحتية مع صورة فضائية للموقع توضح الفعاليات الاقتصادية و الاجتماعية المحيطة", "per": [null, "ارفاق مخطط هيكلي للمنطقة يبين استعمالات الأراضي - الشبكة الطرقية - مواقع المشيدات العامة و الخضراء - دراسات مرفقة ( ميكانيك تربة - الاشتراطات السكنية - الوجائب خطوط تأمين الخدمات العامة مربوطة بالشبكات الرئيسية وتقديم مخطط توجيهي تفصيلي من خلال لجنة مشتركة مع الوحدة الإدارية المعنية", "مخطط تأمين الخدمات الأساسية - المياه و الصرف الصحي و الكهرباء و الاتصالات مع التكاليف - مصدر المياه - الربط بشبكة الصرف أو محطة المعالجة", "مخطط تأمين الخدمات الأساسية - المياه و الصرف الصحي و الكهرباء و الاتصالات مع التكاليف - مصدر المياه - الربط بشبكة الصرف أو محطة المعالجة"]}, {"l": "دراسة جدوى اقتصادية متكاملة", "per": [null, null, null, null]}, {"l": "خطة التمويل و التشغيل و الإدارة تتضمن جدول كلف تفصيلي و برنامج زمني و مالي شامل و مرحلي", "per": [null, null, null, null]}, {"l": "بيانات صاحب المشروع يتضمن وثائق التأسيس - صك التفويض بالتوقيع - إثبات الشخصية - السجل التجاري للشخصية الإعتبارية", "per": [null, null, null, null]}, {"l": "اضبارة تنازل تتضمن التنازل عن الطرق والحدائق وتحدد المقاسم التي تبلغ اسمها 2400 سهم ماعدا منشآت الخدمات العامة (المدارس والمشافي)", "per": [null, null, null, null]}, {"l": "اعداد جدول استئناسي للجنة يضم محددات التخطيط العمراني من ناحية ربط الكثافة بالمساحة والخدمات العامة", "per": [null, null, null, null]}, {"l": "وثائق الملكية أو المشاركة يتضمن قيود عقارية ووكالات", "per": [null, null, null, null]}],OB=["تنفيذ الطرق و المرافق و البنى التحتية و ربطها بالشبكات العامة على حساب المشروع وفق دراسات تنفيذية معتمدة", "تنفيذ المشيدات العامة وفق ما تحدده لجنة القرار بحسب الاستيعاب السكاني و حاجة الوحدة الإدارية و تنفيذ الخدمات العامة ( حدائق - طرق - شبكات و التنازل عنها للوحدة الإدارية", "تقرير إنجاز مرحلي كل ثلاثة أشهر يوضح نسب الإنجاز الفنية و المالية", "تأسيس هيئة الشاغلين وفق القانون 55 لعام 2002 قبل التسليم و تسليمها المرافق المشتركة", "صيانة المرافق العامة على مسؤولية صاحب المشروع سنة كاملة من تاريخ التسليم", "تخصيص ما لا يقل عن 20% من الوحدات للسكن الميسر و حوافز تخطيطية للمساهمات الخدمية"],GU=["كفالات مصرفية", "دفعات مرتبطة بالإنجاز", "تسليم بنسبة إكساء 85%", "أشارات و قيود عقارية", "وثيقة التزام موقعة من صاحب المشروع تتضمن شروط التنفيذ و التمويل والإنجاز"],EX="تنفذ الأعمال تحت إشراف الجهة المختصة في الوحدة الإدارية و يجب أن يكون أعضاء الفريق الهندسي من خلال مكتب هندسي استشاري مسجل لدى النقابة",RS=["تطوير الأحياء الحديثة", "شراكة حقيقية للتنمية", "جودة حياة أفضل", "وضوح المسار", "استدامة المشاريع"],NT="يتم تقديم الأوراق المطلوبة الى مكتب الإنجاز للتدقيق الأولي وتنسيق لقاءات العرض على اللجنة";let cur=0;const done=new Set();
function chips(){const c=$('#tc');c.innerHTML='';TR.forEach((t,i)=>{const b=document.createElement('button');b.className='chip';b.textContent=t.s;b.setAttribute('aria-pressed',i===cur);b.onclick=()=>{cur=i;chips();list()};c.appendChild(b)})}
function list(){$('#dl').innerHTML=DOCS.map((d,i)=>`<label style="display:flex;gap:10px;align-items:flex-start;margin:0 0 10px;color:var(--ink);font-size:14px;cursor:pointer"><input type="checkbox" data-i="${i}" ${done.has(i)?'checked':''} style="width:20px;height:20px;margin-top:4px;accent-color:#1D9E75;flex:none"><span>${d.l}${d.per[cur]?`<br><span style="color:var(--gold3);font-size:13px">◂ ${d.per[cur]}</span>`:''}</span></label>`).join('');
$$('#dl input').forEach(c=>c.onchange=()=>{c.checked?done.add(+c.dataset.i):done.delete(+c.dataset.i);prog()});prog()}
function prog(){const n=DOCS.length,d=done.size;$('#pf').style.width=(d/n*100)+'%';$('#pt').textContent=d+' من '+n}
$('#nt').textContent='ملاحظة: '+NT;$('#ex').textContent=EX;$('#rs').innerHTML=RS.map(x=>`<span class="pill" style="border-color:var(--pur)">${x}</span>`).join('');
$('#ob').innerHTML=OB.map(x=>`<li>${x}</li>`).join('');$('#gu').innerHTML=GU.map(x=>`<li>${x}</li>`).join('');chips();list();</script></body></html>

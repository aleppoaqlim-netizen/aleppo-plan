<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>مسار الترخيص ومهله الزمنية</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/base.css"><style></style></head>
<body><div class="wrap"><h1>مسار الترخيص ومهله الزمنية</h1><div class="quote" style="margin:0 0 16px"><b>النافذة الواحدة:</b> <span id="win"></span></div>
<div class="card" style="margin-bottom:14px"><div style="display:flex;flex-wrap:wrap;gap:14px;align-items:end"><div><label>تاريخ تقديم الطلب (اختياري)</label><input type="date" id="sd" style="width:210px"></div><div style="margin-inline-start:auto;text-align:center"><div class="big" data-count="63" data-suffix=" يوماً">0</div><span class="src">إجمالي مهل الخطوات 1–6</span></div></div>
<div id="seg" style="display:flex;gap:3px;margin-top:16px;height:44px"></div><div id="ticks" style="display:flex;gap:3px;margin-top:6px;font-size:12px;color:var(--mut)"></div><div class="src" style="margin-top:4px">الأرقام تحت الشريط: اليوم التراكمي عند نهاية كل خطوة</div></div>
<div class="grid g4" id="sg"></div><p class="src" style="margin-top:14px">المهل تقديرية بالأيام المتتابعة، والخطوة 3 محسوبة بأيام العمل. المصدر: مقترح أولي منصة (ملف الإكسل)</p></div><script src="assets/base.js"></script><script>const ST=[{"n": "التدقيق الأولي", "d": 5, "u": "أيام", "gis": false}, {"n": "رفع الإضبارة إلى لجنة القرار", "d": 5, "u": "أيام", "gis": false}, {"n": "دراسة الطلب والموافقة الأولية بعد اعتماد الوثائق المقدمة", "d": 15, "u": "يوم عمل", "gis": true, "extra": "تنزيل موقع المشروع على قاعدة البيانات GIS"}, {"n": "رفع المحضر", "d": 3, "u": "أيام", "gis": false}, {"n": "الاعتماد", "d": 15, "u": "يوم", "gis": false}, {"n": "تقديم المخططات الهندسية واستكمال الترخيص", "d": 20, "u": "يوم", "gis": false}, {"n": "موافقة المكتب التنفيذي والتنسيق مع الجهات المعنية والإدارية", "d": null, "u": null, "gis": false}, {"n": "تُحال القرارات للجنة الإقليمية والوحدات الإدارية للاعتماد", "d": null, "u": null, "gis": false}],WIN="النافذة الواحدة بالنسبة للتجمعات العمرانية(الضواحي) هي لجنة القرار في المحافظة بالتنسيق مع هيئة الاستثمار";$('#win').textContent=WIN;const col=['#1D9E75','#2BB88C','#3B8AD4','#7F77DD','#EF9F27','#D85A30'];
const tot=ST.filter(s=>s.d).reduce((a,s)=>a+s.d,0);let cum=0;const cums=ST.map(s=>s.d?(cum+=s.d):null);
const fd=d=>d.toLocaleDateString('ar-SY',{year:'numeric',month:'short',day:'numeric'});
function render(){const sd=$('#sd').value?new Date($('#sd').value):null;
$('#seg').innerHTML=ST.filter(s=>s.d).map((s,i)=>`<div title="${s.n}" onclick="pick(${i})" style="flex:${s.d};background:${col[i]};border-radius:8px;display:grid;place-items:center;color:#04352E;font-weight:800;font-size:13px;cursor:pointer">${i+1}</div>`).join('');
$('#ticks').innerHTML=ST.filter(s=>s.d).map((s,i)=>`<div style="flex:${s.d};text-align:center">${cums[i]}</div>`).join('');
$('#sg').innerHTML=ST.map((s,i)=>{let end='';if(sd&&s.d){const e=new Date(sd);e.setDate(e.getDate()+cums[i]);end=`<div class="src" style="margin-top:6px">ينتهي تقريباً: ${fd(e)}</div>`}
return `<div class="card rv in hv" id="s${i}" style="border-top:3px solid ${col[i]||'var(--gold2)'}"><span class="num" style="background:${col[i]||'var(--gold2)'}">${i+1}</span><h3>${s.n}</h3>${s.extra?`<p>${s.extra}</p>`:''}<div style="margin-top:10px">${s.d?`<span class="pill" style="border-color:${col[i]};background:${col[i]}44">${s.d} ${s.u==='يوم عمل'?'يوم عمل':'يوم'}</span> <span class="src">تراكمي: ${cums[i]}</span>`:'<span class="pill" style="border-color:var(--gold2)">بلا مدة محددة</span>'}</div>${end}</div>`}).join('')}
function pick(i){const e=$('#s'+i);e.scrollIntoView({behavior:'smooth',block:'center'});e.style.boxShadow='0 0 0 2px var(--gold)';setTimeout(()=>e.style.boxShadow='',1400)}
$('#sd').onchange=render;render();</script></body></html>
